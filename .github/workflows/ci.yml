name: Workflow Integrity & Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Audit workflow schemas, hooks, links & hygiene
        run: python .agents/scripts/verify_workflow.py

      - name: Run deterministic hook & ops unit tests
        run: python -m unittest discover -s .agents/scripts -p "test_*.py" -v

      - name: Smoke-test placeholder scanner
        run: python .agents/scripts/workflow_ops.py check-placeholders
